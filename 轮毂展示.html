<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轮毂库存展示</title>
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #1a1a1a;
    --border: #2a2a2a;
    --text: #e0e0e0;
    --text-dim: #888;
    --accent: #d4a853;
    --card-radius: 8px;
    --gap: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(13,13,13,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
  }
  header .inner {
    max-width: 1440px; margin: 0 auto;
    display: flex; flex-wrap: wrap; align-items: center;
    justify-content: space-between; gap: 10px;
  }
  header h1 {
    font-size: 1.2rem; font-weight: 600; letter-spacing: .02em;
    color: var(--text); white-space: nowrap;
  }
  header h1 span { color: var(--accent); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters button {
    background: var(--surface); color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 20px;
    padding: 6px 16px; font-size: .82rem; cursor: pointer;
    transition: all .2s;
  }
  .filters button:hover { border-color: var(--accent); color: var(--text); }
  .filters button.active { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
  .count { font-size: .82rem; color: var(--text-dim); white-space: nowrap; }

  /* ── Grid ── */
  .gallery {
    max-width: 1440px; margin: 0 auto; padding: var(--gap);
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: var(--gap);
  }
  .card {
    background: var(--surface);
    border-radius: var(--card-radius);
    overflow: hidden;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s;
    aspect-ratio: 1;
    position: relative;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(0,0,0,.5);
  }
  .card img {
    width: 100%; height: 100%;
    object-fit: contain;
    background: #111;
    display: block;
    transition: opacity .3s;
  }
  .card img.lazy { opacity: 0; }
  .card img.loaded { opacity: 1; }
  .card .label {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,.75));
    padding: 20px 10px 8px;
    font-size: .72rem; color: #bbb; text-align: center;
    pointer-events: none;
  }

  /* ── Lightbox ── */
  .lightbox {
    display: none;
    position: fixed; inset: 0; z-index: 999;
    background: rgba(0,0,0,.92);
    justify-content: center; align-items: center;
    flex-direction: column;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 92vw; max-height: 82vh;
    object-fit: contain;
    border-radius: 4px;
  }
  .lightbox .info {
    margin-top: 12px; font-size: .85rem; color: #aaa;
  }
  .lightbox .close {
    position: absolute; top: 16px; right: 24px;
    font-size: 2rem; color: #fff; cursor: pointer;
    background: none; border: none; line-height: 1;
  }
  .lightbox .nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    font-size: 2.5rem; color: #fff; cursor: pointer;
    background: rgba(255,255,255,.08); border: none;
    width: 50px; height: 80px; border-radius: 6px;
    transition: background .2s;
  }
  .lightbox .nav:hover { background: rgba(255,255,255,.18); }
  .lightbox .prev { left: 12px; }
  .lightbox .next { right: 12px; }

  /* ── Empty state ── */
  .empty {
    grid-column: 1 / -1; text-align: center;
    padding: 60px 20px; color: var(--text-dim);
  }

  @media (max-width: 600px) {
    .gallery { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
    header h1 { font-size: 1rem; }
    .lightbox .nav { width: 36px; height: 56px; font-size: 1.6rem; }
  }
</style>
</head>
<body>

<header>
  <div class="inner">
    <h1>🛞 <span>26款</span> 轮毂库存展示</h1>
    <div class="filters">
      <button class="active" data-filter="all">全部</button>
      <button data-filter="文档1">文档一</button>
      <button data-filter="文档2">文档二</button>
    </div>
    <div class="count" id="counter"></div>

</header>

<div class="gallery" id="gallery"></div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="close" id="lbClose">&times;</button>
  <button class="nav prev" id="lbPrev">‹</button>
  <button class="nav next" id="lbNext">›</button>

  <div class="info" id="lbInfo"></div>

const BASE_PATH = "轮廓照片/";
const gallery = document.getElementById("gallery");
const counter = document.getElementById("counter");
const lightbox = document.getElementById("lightbox");
const lbImg = document.getElementById("lbImg");
const lbInfo = document.getElementById("lbInfo");
let currentFilter = "all";
let currentIndex = -1;

// ── Render ──
function render(filter) {
  currentFilter = filter;
  const filtered = filter === "all" ? IMAGES : IMAGES.filter(f => f.startsWith(filter));
  counter.textContent = `共 ${filtered.length} 張圖片`;

  if (filtered.length === 0) {
    gallery.innerHTML = '<div class="empty">沒有匹配的圖片</div>';
    return;
  }

  gallery.innerHTML = filtered.map((f, i) => `
    <div class="card" data-idx="${i}" data-file="${f}" onclick="openLightbox(${i})">
      <img src="${BASE_PATH}${f}" alt="${f}" loading="lazy" class="lazy" onload="this.classList.add('loaded')" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect fill=%22%23222%22 width=%22200%22 height=%22200%22/><text fill=%22%23666%22 x=%22100%22 y=%22106%22 text-anchor=%22middle%22 font-size=%2212%22>加载失败</text></svg>'">
      <div class="label">${f.replace(/\.(png|jpe?g)$/i,'')}</div>
    </div>
  `).join("");

  // Store filtered list globally for lightbox navigation
  gallery._filtered = filtered;
}

// ── Lightbox ──
function openLightbox(idx) {
  const list = gallery._filtered || IMAGES;
  currentIndex = idx;
  showImage(list[idx], idx, list.length);
  lightbox.classList.add("open");
  document.body.style.overflow = "hidden";
}

function showImage(file, idx, total) {
  lbImg.src = BASE_PATH + file;
  lbInfo.textContent = `${file}  (${idx + 1} / ${total})`;
}

function closeLightbox() {
  lightbox.classList.remove("open");
  document.body.style.overflow = "";
}

function navLightbox(dir) {
  const list = gallery._filtered || IMAGES;
  currentIndex = (currentIndex + dir + list.length) % list.length;
  showImage(list[currentIndex], currentIndex, list.length);
}

// ── Event listeners ──
document.getElementById("lbClose").addEventListener("click", closeLightbox);
document.getElementById("lbPrev").addEventListener("click", () => navLightbox(-1));
document.getElementById("lbNext").addEventListener("click", () => navLightbox(1));
lightbox.addEventListener("click", e => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener("keydown", e => {
  if (!lightbox.classList.contains("open")) return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowLeft") navLightbox(-1);
  if (e.key === "ArrowRight") navLightbox(1);
});

// ── Filters ──
document.querySelectorAll(".filters button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filters button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    render(btn.dataset.filter);
  });
});

// ── Init ──
render("all");
